<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#8E1450"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Woman Next Door"><title>Woman Next Door</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💗%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500;1,6..96,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#FFF4F7;--surface:#FFFFFF;--soft:#FDE6EE;--line:#F4CBDA;--ink:#2A0E1B;--muted:#7A5767;--berry:#8E1450;--berry-2:#B01B64;--hot:#E8237A;--rose:#F9B6CF;--on-berry:#FFFFFF;--shadow:0 1px 2px rgba(142,20,80,.06),0 10px 28px rgba(142,20,80,.09);--c-book:#8E1450;--c-pickle:#FF5C8A;--c-meetup:#D63A7A;--c-travel:#B0306E;--c-skill:#F28DB5;--c-other:#C9A0B3;--c-faith:#B06AB3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0911;--surface:#26101B;--soft:#351524;--line:#4B2034;--ink:#FCE9F1;--muted:#C99DB1;--berry:#FF7AB6;--berry-2:#FF93C4;--hot:#FF4F9A;--rose:#7A2B4F;--on-berry:#2A0E1B;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A0911;--surface:#26101B;--soft:#351524;--line:#4B2034;--ink:#FCE9F1;--muted:#C99DB1;--berry:#FF7AB6;--berry-2:#FF93C4;--hot:#FF4F9A;--rose:#7A2B4F;--on-berry:#2A0E1B;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .mark{font-family:"Bodoni Moda",Didot,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:16px;height:16px;fill:var(--hot);flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:var(--berry);fill:none;stroke-width:1.8}
main{padding:22px 0 120px}
.hero{padding:10px 0 26px}
.hero h1{font-family:"Bodoni Moda",Didot,serif;font-weight:500;font-style:italic;font-size:clamp(42px,11vw,68px);line-height:.98;letter-spacing:-.02em;margin:0 0 14px;background:linear-gradient(100deg,var(--berry) 0%,var(--berry) 38%,var(--hot) 48%,#FFD1E3 52%,var(--hot) 56%,var(--berry) 66%,var(--berry) 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s ease-out .3s 1 both}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:34ch}
.hero .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
h2{font-family:"Bodoni Moda",Didot,serif;font-weight:600;font-size:24px;letter-spacing:-.01em;margin:0}
h3{font-size:17px;font-weight:700;margin:0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.sechead a,.link{color:var(--berry);font-weight:700;font-size:14px;text-decoration:none;background:none;border:0;cursor:pointer;padding:4px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.1}
.btn.primary{background:var(--berry);color:var(--on-berry)}
.btn.primary:hover{background:var(--berry-2)}
.btn.ghost{background:var(--surface);color:var(--berry);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#C62848;border:1px solid currentColor}
.btn.sm{padding:8px 14px;font-size:14px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.feature{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;position:relative;overflow:hidden}
.feature::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--rose) 0%,transparent 70%);opacity:.55;pointer-events:none}
.datebadge{width:66px;border-radius:16px;background:var(--berry);color:var(--on-berry);text-align:center;padding:9px 0 10px;flex:none}
.datebadge .m{font-size:12px;font-weight:700;letter-spacing:.04em;opacity:.9}
.datebadge .d{font-family:"Bodoni Moda",Didot,serif;font-size:32px;font-weight:600;line-height:1}
.datebadge .w{font-size:12px;opacity:.9}
.feature h3{font-size:20px;margin:4px 0 6px;font-family:"Bodoni Moda",Didot,serif;font-weight:600}
.meta{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);background:var(--soft);border-radius:999px;padding:4px 10px}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.list{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;text-align:left;width:100%;border-radius:18px}
.ev .stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .when{width:52px;flex:none;text-align:center}
.ev .when .d{font-family:"Bodoni Moda",Didot,serif;font-size:24px;font-weight:600;line-height:1}
.ev .when .m{font-size:12px;color:var(--muted);font-weight:700}
.ev .body{flex:1;min-width:0}
.ev .body h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .body .muted{font-size:14px}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.bookcard{padding:22px;display:grid;grid-template-columns:92px 1fr;gap:18px;align-items:center}
.cover{aspect-ratio:2/3;border-radius:6px 12px 12px 6px;background:linear-gradient(160deg,var(--hot),var(--berry));color:#fff;padding:10px 9px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 6px 0 0 rgba(0,0,0,.14),0 8px 18px rgba(142,20,80,.25);overflow:hidden}
.cover .t{font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-size:14px;line-height:1.1;word-break:break-word}
.cover .a{font-size:10px;opacity:.85}
.cover.big{width:140px}
.cover.big .t{font-size:20px}
.cover.big .a{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:16px;text-align:left}
.stat b{display:block;font-family:"Bodoni Moda",Didot,serif;font-size:30px;font-weight:600;line-height:1;color:var(--berry)}
.stat span{font-size:13px;color:var(--muted)}
.cal{padding:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{font-size:22px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.day{aspect-ratio:1;border:0;background:transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:600;padding:0}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 1.5px var(--hot)}
.day.sel{background:var(--berry);color:var(--on-berry)}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.sel .dots i{background:var(--on-berry)!important}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;font-size:15px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.member{padding:18px;display:flex;flex-direction:column;gap:10px}
.mtop{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-weight:600;font-size:19px;color:#fff;background:linear-gradient(140deg,var(--hot),var(--berry))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.static{cursor:default;background:var(--soft);border-color:transparent;padding:4px 10px;font-size:12px}
.chip.on{background:var(--berry);color:var(--on-berry);border-color:var(--berry)}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.circle{padding:18px}
.circle .ppl{display:flex;margin-top:10px}
.circle .ppl .av{width:34px;height:34px;font-size:14px;border:2px solid var(--surface);margin-right:-8px}
.empty{padding:28px 22px;text-align:center}
.empty p{margin:6px 0 16px;color:var(--muted)}
.banner{font-size:13px;background:var(--soft);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.schedule{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.schedule li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.schedule li:first-child{border-top:0}
.schedule li b{color:var(--berry);min-width:64px;white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:66px;padding:0 6px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button[aria-current="page"]{color:var(--berry)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--hot)}
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(42,14,27,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:26px;max-height:88%}}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 14px;font-size:16px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:14px}
.check input{width:20px;height:20px;accent-color:var(--berry);margin-top:1px}
.sheetfoot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:90%;text-align:center}
.burst{position:fixed;pointer-events:none;z-index:70}
.burst svg{position:absolute;width:14px;height:14px;fill:var(--hot);animation:pop .8s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.1) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1{background-position:0 0}}
@media (max-width:420px){.bookcard{grid-template-columns:76px 1fr}.stats .stat b{font-size:26px}}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--berry);box-shadow:0 1px 3px rgba(142,20,80,.15)}
.spark-card{padding:20px 22px;background:linear-gradient(135deg,var(--berry),var(--hot));color:#fff;border:0;position:relative;overflow:hidden}
.spark-card .k{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;opacity:.9}
.spark-card .k svg{width:14px;height:14px;fill:#fff}
.spark-card p{font-family:"Bodoni Moda",Didot,serif;font-size:21px;line-height:1.3;margin:8px 0 0}
.spark-card::after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.splash{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 90% at 20% 10%,#FF5CA3 0%,#C2185B 45%,#6E0F3E 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 28px calc(40px + env(safe-area-inset-bottom,0px));animation:fadein .5s ease-out}
.splash .inner{max-width:560px;margin:0 auto;width:100%}
.splash .k{font-size:14px;font-weight:700;opacity:.85;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.splash .k svg{width:16px;height:16px;fill:#fff}
.splash blockquote{margin:0;font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-size:clamp(28px,7.5vw,44px);line-height:1.15;animation:rise .9s ease-out .15s both}
.splash .btn{margin-top:30px;background:#fff;color:#8E1450}
.splash .fl{position:absolute;fill:#fff;opacity:.0;animation:twinkle 2.4s ease-in-out infinite}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1)}}
.morelist{display:flex;flex-direction:column;gap:10px}
.moreitem{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left;cursor:pointer}
.moreitem .ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.moreitem .ic svg{width:22px;height:22px;stroke:var(--berry);fill:none;stroke-width:1.7}
.moreitem .body{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--berry);font-weight:700;background:none;border:0;cursor:pointer;padding:4px 0;font-size:14px}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.res{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.res h3 a{color:inherit;text-decoration:none}
.trip{overflow:hidden}
.trip .top{padding:22px;background:linear-gradient(135deg,var(--soft),var(--surface));border-bottom:1px solid var(--line)}
.trip .top h3{font-family:"Bodoni Moda",Didot,serif;font-size:24px;margin:6px 0 2px}
.trip .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:16px 22px}
.trip .facts b{display:block;font-size:12px;color:var(--muted);font-weight:700}
.trip .rest{padding:0 22px 20px}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--berry);color:var(--on-berry)}
.status.wait{background:var(--rose);color:var(--ink)}
.status.sold{background:var(--line);color:var(--muted)}
.place{padding:16px 18px}
.place .cities{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.adminbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--soft);border-radius:16px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.adminbar b{margin-right:auto}
.guide{white-space:pre-line;padding:22px;line-height:1.7}
.nextbook{padding:18px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.pastlist{display:flex;flex-direction:column;gap:6px}
.windaycard{padding:18px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;background:var(--soft);border-color:var(--rose)}
.win{padding:18px}
.win p{margin:10px 0 0;white-space:pre-line}
.win.big p{font-family:"Bodoni Moda",Didot,serif;font-size:19px;line-height:1.35}
button.brand{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logoplate{display:inline-block;line-height:0}
.hlogo{height:38px;width:auto;display:block}
.herologo{width:min(340px,86%);height:auto;display:block;margin:0 0 14px}
.hero .hi{font-weight:700;color:var(--berry);margin:0 0 4px;font-size:17px}
.gate{min-height:100%;display:flex;align-items:center;padding:40px 0;text-align:center;background:radial-gradient(90% 60% at 50% 0%,var(--soft),var(--bg) 70%)}
.gate .wrap{width:100%}
.gatelogo{width:min(380px,88%);height:auto;margin:0 auto 26px;display:block}
.gate h2{font-size:28px;margin:0 0 8px}
.gate>.wrap>p{margin:0 auto 26px;max-width:34ch}
.gatebox{padding:24px;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;max-width:520px;margin:0 auto;text-align:center}
.gatebox h3{margin-bottom:12px}
.gatebox .btn{width:100%}
.gatebox .or{width:1px;align-self:stretch;background:var(--line)}
@media (max-width:480px){.gatebox{grid-template-columns:1fr}.gatebox .or{width:auto;height:1px}}
.girlies{padding:18px 20px;margin-bottom:14px;background:linear-gradient(135deg,var(--soft),var(--surface))}
.socials{display:flex;flex-direction:column;gap:6px}
.soc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:14px}
.soc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soc .go{color:var(--berry);font-weight:700;flex:none}
.invite{padding:18px 20px;margin-top:16px;border-color:var(--rose)}
.memory{overflow:hidden}
.mphoto{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.mphoto.ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--rose),var(--hot))}
.mphoto.ph .spark{width:40px;height:40px;fill:#fff}
.mbody{padding:16px 18px 18px}
.photoedit{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.photoedit img{max-height:140px;border-radius:12px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hot);color:#fff;font-size:12px;font-weight:700;vertical-align:middle;font-family:"Manrope",system-ui,sans-serif}
.iconbtn.badged{position:relative}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.meter{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin-bottom:12px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--berry));border-radius:999px}
.gatetitle{font-family:"Bodoni Moda",Didot,serif;font-style:italic;color:var(--berry);font-size:44px;margin:0 0 20px}
details summary{cursor:pointer;display:inline}
.btn:disabled{opacity:.6;cursor:default}
.doorcard{display:flex;align-items:center;gap:16px;padding:16px 18px;width:100%;text-align:left;cursor:pointer;background:radial-gradient(120% 140% at 0% 50%,color-mix(in srgb,var(--hot) 16%,var(--surface)),var(--surface) 60%);border-color:var(--rose)}
.doorcard .doorsvg{width:58px;height:78px;flex:none}
.doorcard .dbody{flex:1;display:flex;flex-direction:column;gap:2px}
.doorcard h3{font-family:"Bodoni Moda",Didot,serif;font-size:21px}
.kick{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hot)}
.doorsvg{filter:drop-shadow(0 0 10px rgba(255,79,154,.55));animation:doorglow 3.2s ease-in-out infinite}
@keyframes doorglow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,79,154,.35))}50%{filter:drop-shadow(0 0 18px rgba(255,79,154,.85))}}
.doorhero{display:flex;gap:20px;align-items:center;padding:8px 0 22px}
.doorhero .doorsvg{width:110px;height:146px;flex:none}
.doorhero h2{font-size:30px;margin:4px 0 6px}
.doorhero p{margin:0}
.doorsoon{border-color:var(--rose)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod{overflow:hidden;display:flex;flex-direction:column}
.pimg{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pimg.ph{display:grid;place-items:center;background:linear-gradient(160deg,var(--soft),var(--surface))}
.pimg.ph .doorsvg{width:60px;height:80px;animation:none}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pbody h3{font-size:16px}
.pbody p{margin:2px 0 0}
.price{font-family:"Bodoni Moda",Didot,serif;font-size:20px;font-weight:600;color:var(--berry)}
.pbody .actions{margin-top:auto;padding-top:8px}
@media (max-width:420px){.doorhero .doorsvg{width:84px;height:112px}.doorhero h2{font-size:25px}}
.wabtn{background:#1FA855!important;color:#fff!important;padding:14px 22px;font-size:16px;margin-top:8px}
.btn.is-done{cursor:default;opacity:.75}
.gate .kick{display:block;margin-bottom:6px}
p.kick{margin:0 0 12px}
.gate .check{max-width:420px;margin-left:auto;margin-right:auto;text-align:left}
nav.tabs .wrap{grid-template-columns:repeat(6,1fr);padding:0 2px}
nav.tabs button{font-size:10.5px;gap:3px;padding:0}
nav.tabs svg{width:21px;height:21px}
.iconbtn.morebtn{width:auto;padding:0 12px;border-radius:999px;gap:6px;display:inline-flex;align-items:center;font-weight:700;font-size:13px;color:var(--berry)}
.iconbtn.morebtn.on{background:var(--berry);color:var(--on-berry)}
.iconbtn.morebtn.on svg{stroke:var(--on-berry)}
header.top .wrap{gap:8px}
.featcard{padding:20px;background:linear-gradient(135deg,var(--soft),var(--surface));border-color:var(--rose)}
.featcard h3{font-family:"Bodoni Moda",Didot,serif;font-size:22px;margin-top:4px}
.featured{margin-bottom:6px}
nav.tabs button span{white-space:nowrap;letter-spacing:-.02em}
@media (max-width:380px){nav.tabs button{font-size:9px}nav.tabs svg{width:19px;height:19px}}

.hero .slogan,.slogan{font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-size:21px;color:var(--berry);margin:0 0 6px}
.hero .desc{color:var(--muted);font-size:15.5px;max-width:40ch;margin:0}
.gatedesc{max-width:36ch;margin:0 auto 8px!important}
.faithcard{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left;cursor:pointer;margin-top:14px;background:linear-gradient(135deg,color-mix(in srgb,#E9D5F5 55%,var(--surface)),var(--surface));border-color:color-mix(in srgb,#B06AB3 35%,var(--line))}
.faithcard .fbody{flex:1;display:flex;flex-direction:column;gap:4px}
.faithcard .fverse{font-family:"Bodoni Moda",Didot,serif;font-size:17px;line-height:1.35}
.dove{font-size:34px;line-height:1;flex:none}
.dove.big{font-size:56px}
.faithhero{display:flex;gap:16px;align-items:center;padding:6px 0 18px}
.faithhero h2{font-size:24px;margin-top:4px}
.votd{padding:22px;background:linear-gradient(135deg,color-mix(in srgb,#E9D5F5 50%,var(--surface)),var(--surface))}
.votd blockquote{margin:10px 0 0;font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-size:22px;line-height:1.35}
.faithchips{margin:16px 0 4px}
.devrow{display:flex;flex-direction:column;gap:4px}
.devverse{margin:0 0 12px;padding:12px 16px;border-left:3px solid var(--hot);background:var(--soft);border-radius:0 12px 12px 0;font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-size:18px}
.devprayer{font-style:italic;color:var(--berry)}
.about{line-height:1.75}
.chip.otherchip{border-style:dashed}
.lvl{font-size:22px;flex:none}
.actrow .mtop{align-items:center}
.sheetbox{padding:16px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.adminpanel{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--soft)}
.xtag,.rtag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;vertical-align:middle;font-family:"Manrope",system-ui,sans-serif}
.xtag{background:#FBD5DA;color:#9B1C31}
.rtag{background:var(--rose);color:var(--ink)}
.ev.cancelled h3{text-decoration:line-through;text-decoration-thickness:1px}
.ev.cancelled{opacity:.75}
.newscard{padding:16px 18px;margin-bottom:14px;border-color:var(--rose)}
.newsrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer;font-size:14.5px;color:var(--ink)}
.newsrow:first-of-type{border-top:0}
.newsitem{text-align:left;cursor:pointer;width:100%}
.tbcard{padding:20px;background:linear-gradient(135deg,color-mix(in srgb,#CFE8FF 45%,var(--surface)),var(--surface));border-color:color-mix(in srgb,#5AA0E0 35%,var(--line))}
.tbcard h3{font-family:"Bodoni Moda",Didot,serif;font-size:22px;margin-top:4px}
.tblist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.tbitem{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-top:10px;border-top:1px solid var(--line)}
.tbitem a{color:inherit}
.owntravel{padding:20px;background:linear-gradient(135deg,var(--soft),var(--surface));border-color:var(--rose)}
.owntravel h3{font-family:"Bodoni Moda",Didot,serif;font-size:21px;margin-top:4px}
.founder{display:inline-block;font-size:11.5px;font-weight:700;color:#7A4A00;background:#FFE9B8;border-radius:999px;padding:2px 9px;margin:2px 0 2px}
.foundercard{border-color:#F2C46B;box-shadow:0 0 0 1px #F7D79A,var(--shadow)}
.nudgecard{padding:16px 18px;margin-bottom:14px;background:linear-gradient(135deg,var(--soft),var(--surface));border-color:var(--hot)}
.verifybox{padding:18px;margin:6px auto 16px;max-width:460px;text-align:center;border-color:var(--rose)}
.vbadge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#FFF1CC;color:#7A5200;margin-top:3px}
.vbadge.ok{background:#DDF5E4;color:#1E6B3A}
.rcount{font-family:"Bodoni Moda",Didot,serif;font-size:30px;font-weight:600;color:var(--berry);text-align:center;line-height:1}
.rcount small{display:block;font-family:"Manrope",system-ui,sans-serif;font-size:11px;color:var(--muted);font-weight:700}
.rlist{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.newdot{font-size:10px;font-weight:700;color:#fff;background:var(--hot);border-radius:999px;padding:1px 6px;vertical-align:middle}
</style></head>

igning flyers, social posts and branding in Canva.", "by": ""}, {"id": "r5", "title": "Khan Academy: Personal finance", "url": "https://www.khanacademy.org/college-careers-more/personal-finance", "cat": "Money & investing", "desc": "Free, simple lessons on budgeting, saving, credit and investing.", "by": ""}], "recs": [], "wins": [], "guidelines": "Woman Next Door is a space for women to support each other, share what we know and grow together. By joining, you agree to:\n\n1. Be kind. Lift each other up and celebrate each other's wins.\n2. Respect differences. Everyone is welcome here, whatever her background, beliefs or stage of life.\n3. Keep it confidential. What's shared here stays here. No screenshots of members' details, posts or conversations.\n4. Ask before you sell. No promotions, business pitches or unsolicited sales messages without an admin's okay.\n5. Respect privacy. Never share another member's number, photos or details without her permission, and only message people who've agreed to connect.\n6. Ask before you post photos. Check with anyone in a photo before sharing it.\n7. Handle disagreements privately and kindly. If something can't be resolved, reach out to an admin.\n8. Meet safely. First meetups happen in public places, and tell someone where you're going.\n9. Speak up. If anything feels off, report it privately in the app. Reports are anonymous.\n10. Photos and videos: pictures, videos and your likeness from Woman Next Door events and activities may be used in content by Woman Next Door, its admins, or Mentored by Jeneil. If you'd prefer not to be featured, just message an admin and we'll respect that.\n11. Breaking these guidelines may lead to a warning, a pause, or removal from the community, depending on how serious it is.", "waLink": "https://chat.whatsapp.com/J3pJDKi0OMpEwrSS64dWOc", "about": "Woman Next Door is a social and networking community created to bring women together, not just online, but in real life.\n\nAt its heart is the belief that women thrive when they have access to community, connection, knowledge, resources, opportunities, and people who genuinely want to see them do well.\n\nWoman Next Door creates opportunities and an environment for women to find their people, find community, find help, and find the resources and connections they need to grow.\n\nIt's a space where women can meet other women, build genuine friendships, network, share knowledge and resources, discover new opportunities, try new experiences, and grow both personally and professionally.\n\n\ud83c\udf80 What does Woman Next Door offer?\n\n\ud83e\ude77 Connection: opportunities to meet women, build friendships, and create genuine relationships.\n\ud83e\udd1d\ud83c\udffd Community: a space where women can feel supported, welcomed, and connected to something bigger than themselves.\n\ud83d\udcda Knowledge & Resources: sharing information, recommendations, tools, opportunities, and resources that can help another woman move forward.\n\ud83d\udcbc Professional Growth: networking, collaborations, business connections, mentorship, and opportunities to learn from one another.\n\ud83c\udf31 Personal Growth: encouraging women to step outside their comfort zones, learn, develop, and become the women they want to be.\n\u2728 Experiences: social events, activities, outings, and experiences that give women opportunities to connect while simply enjoying life together.\n\ud83e\udef6\ud83c\udffd Support: creating a culture where women show up for one another, share what they know, open doors for one another, and celebrate each other's wins.\n\nThe bigger idea\n\nWoman Next Door isn't just a group chat, an event club, or another social media community. It's about creating the opportunities and environment for women to find their people, find community, find help, and find resources.\n\nMaybe you need a new friend.\nMaybe you're looking for someone who knows what you don't know.\nMaybe you need a recommendation, a connection, a business resource, or simply someone to point you in the right direction.\nMaybe you're looking for opportunities to grow professionally.\nMaybe you just want to get out, meet new women, and experience life with people who understand.\n\nWoman Next Door is about making those connections possible.\n\n\ud83c\udf80 The mission\n\nTo create opportunities and an environment where women can find their people, build community, access resources, share knowledge, and grow personally and professionally.\n\nWoman Next Door\nFor Her. With Her. Beside Her. \ud83e\ude77\ud83c\udf80", "faith": {"devotionals": [{"id": "d1", "title": "Clothed in Strength", "ref": "Proverbs 31:25", "verse": "Strength and honour are her clothing; and she shall rejoice in time to come.", "body": "Notice what she wears. Not worry, not comparison, not the weight of every expectation placed on her, but strength and honour. And because of what she is wrapped in, she can look at the future and laugh instead of fear.\n\nSome mornings you won't feel strong. That's okay. Strength here isn't a feeling; it's a garment God places on you. You put it on by trusting Him with what you can't control and doing the next faithful thing in front of you.\n\nToday, choose what you'll wear. Lay down the worry. Put on the strength He's already given you.", "prayer": "Lord, clothe me in Your strength today. Help me face what's ahead with faith instead of fear. Amen."}, {"id": "d2", "title": "She Shall Not Be Moved", "ref": "Psalm 46:5", "verse": "God is in the midst of her; she shall not be moved: God shall help her, and that right early.", "body": "This verse doesn't promise that nothing around her will shake. It promises something better: God is in the midst of her. The storm may be loud, the season may be uncertain, but the centre holds because He is there.\n\nAnd look at the timing: God shall help her, and that right early. Before the day gets away from you, before the problem grows, He is already on the way.\n\nIf you feel unsteady right now, you don't have to hold yourself together alone. Invite Him into the middle of it. That's where your steadiness comes from.", "prayer": "God, be in the middle of everything I'm carrying. Steady me, and help me early today. Amen."}, {"id": "d3", "title": "For Such a Time as This", "ref": "Esther 4:14", "verse": "Who knoweth whether thou art come to the kingdom for such a time as this?", "body": "Esther never planned to be where she was. Yet the very place she found herself became the place God used her to save her people.\n\nYou may wonder why you're in this job, this city, this season, this community. What if you're not there by accident? What if someone needs exactly your voice, your kindness, your courage, right where you are?\n\nYou don't need a bigger platform to make a difference. You need to show up faithfully in the place God has already put you.", "prayer": "Lord, open my eyes to why You've placed me here. Give me courage to act when it matters. Amen."}, {"id": "d4", "title": "The God Who Sees Me", "ref": "Genesis 16:13", "verse": "And she called the name of the LORD that spake unto her, Thou God seest me.", "body": "Hagar was alone, overlooked, and running away. Nobody was looking for her. But God found her in the wilderness, and she became the first person in Scripture to give Him a name: the God who sees me.\n\nMaybe you feel unseen right now: in your family, your work, your effort, your pain. You are not invisible to Him. He sees what others miss, and He meets you right where you are, even in the wilderness.\n\nToday, rest in this: you are fully seen, fully known, and still fully loved.", "prayer": "Thank You, God, for seeing me when I feel invisible. Meet me where I am today. Amen."}, {"id": "d5", "title": "Better Together", "ref": "Ecclesiastes 4:9\u201310", "verse": "Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow.", "body": "We were never meant to do life alone. God designed us for connection: people who lift us when we fall and celebrate us when we rise.\n\nThat's the heart of this community. Somewhere in this group is a woman who needs your encouragement today, and a woman whose words you need to hear.\n\nThis week, be the one who lifts. Send the message. Say the prayer. Show up. And when you're the one who's fallen, let yourself be lifted too.", "prayer": "Lord, thank You for the women You've placed around me. Help me lift others, and let me be lifted too. Amen."}], "verses": [], "questions": [], "answers": [], "testimonies": [], "prayers": [], "resources": [{"id": "fr1", "kind": "faith", "title": "YouVersion Bible App", "url": "https://www.bible.com", "desc": "Free Bible app with reading plans, devotionals and audio Bibles."}, {"id": "fr2", "kind": "faith", "title": "Proverbs 31 Ministries", "url": "https://proverbs31.org", "desc": "Free daily devotions and encouragement written for women."}, {"id": "fr3", "kind": "study", "title": "Bible Gateway", "url": "https://www.biblegateway.com", "desc": "Read and compare many Bible translations side by side."}, {"id": "fr4", "kind": "study", "title": "BibleProject", "url": "https://bibleproject.com", "desc": "Free videos and guides that explain every book of the Bible."}, {"id": "fr5", "kind": "study", "title": "Blue Letter Bible", "url": "https://www.blueletterbible.org", "desc": "Free study tools: original words, commentaries and cross-references."}]}}</script><script type="module">

/* ---------- demo store (used until Firebase is connected) ---------- */
function demoStore(){
 let db;try{db=JSON.parse(localStorage.getItem("wnd-demo")||"null")}catch(e){}
 if(!db){const me="owner";db={content:seedContent(),directory:{},members:{},requests:{},rsvps:{},photos:{},admins:{},connections:{},pub:{waLink:SEED.waLink||"",autoApprove:false},users:{"you@demo.app":{pw:"password",uid:me}},session:me,stats:{}};
  db.members[me]={status:"approved",email:"you@demo.app",name:"You (admin)",application:{name:"You (admin)"}};db.directory[me]=entryFrom({name:"You (admin)",city:"Kingston",country:"Jamaica",interests:["Books","Travel"]})}
 db.connections=db.connections||{};db.pub=db.pub||{waLink:"",autoApprove:false};
 const persist=()=>{try{localStorage.setItem("wnd-demo",JSON.stringify(db))}catch(e){}};
 const clone=o=>JSON.parse(JSON.stringify(o));
 const fail=(code)=>{const e=new Error(code);e.code=code;return Promise.reject(e)};
 function refresh(){persist();PUB=clone(db.pub);const u=db.session;
  if(!u){USER=null;MODE="out";render();return}
  const em=Object.keys(db.users).find(k=>db.users[k].uid===u);USER={uid:u,email:em};
  OWNER=em==="you@demo.app";ADMIN=OWNER||!!db.admins[u];ME=db.members[u]?clone(db.members[u]):null;
  if(!ADMIN&&(!ME||ME.status!=="approved")){MODE=ME&&ME.status!=="pending"?"inactive":"pending";render();return}
  C=normalize(clone(db.content));D=clone(db.directory);
  CONNS=Object.keys(db.connections).map(k=>Object.assign({id:k},clone(db.connections[k]))).filter(c=>c.from===u||c.to===u);
  CONNS.forEach(c=>{if(c.from===u&&c.status==="accepted"&&!c.fromPhone&&ME&&ME.phone)db.connections[c.id].fromPhone=ME.phone});
  PENDING=Object.keys(db.members).filter(k=>db.members[k].status==="pending").map(k=>Object.assign({uid:k},clone(db.members[k])));
  REQS=Object.keys(db.requests).filter(k=>db.requests[k].status==="pending").map(k=>Object.assign({id:k},clone(db.requests[k])));
  const first=MODE!=="app";MODE="app";if(first)setTimeout(migrate,0);render();if(first){db.stats[todayStr]=(db.stats[todayStr]||0)+1;const mm=db.members[u];if(mm&&mm.lastSeen!==todayStr){const cut=ymd(new Date(now.getTime()-30*864e5));mm.days=(mm.days||[]).filter(d=>d>=cut&&d!==todayStr).concat([todayStr]);mm.lastSeen=todayStr}persist();firstOpen()}}
 const ok=v=>{refresh();return Promise.resolve(v)};
 return {demo:true,
  start(){setTimeout(refresh,0)},
  signIn(e,p){e=e.toLowerCase();const u=db.users[e];if(!u)return fail("auth/invalid-credential");if(u.pw!==p)return fail("auth/invalid-credential");db.session=u.uid;return ok()},
  signUp(e,p,a){e=e.toLowerCase();if(db.users[e])return fail("auth/email-already-in-use");const u=uid();db.users[e]={pw:p,uid:u};const st=db.pub.autoApprove?"approved":"pending";db.members[u]={status:st,email:e,name:a.name,phone:a.phone||"",application:a};if(st==="approved")db.directory[u]=entryFrom(a);db.session=u;return ok()},
  setPublic(p){Object.assign(db.pub,p);return ok()},
  quota(){db.quota=db.quota||{};return Promise.resolve(clone(db.quota[USER.uid+"_"+weekId()]||{}))},
  sendConn(to,kind,note){db.quota=db.quota||{};const k=USER.uid+"_"+weekId(),q=db.quota[k]=db.quota[k]||{};if(!ADMIN&&(q.conn||0)>=CONN_LIMIT)return fail("permission-denied");q.conn=(q.conn||0)+1;db.connections[uid()]={from:USER.uid,fromName:myName(),to,toName:(D[to]&&D[to].name)||"",kind,note:note||"",status:"pending",createdAt:{seconds:Date.now()/1000}};return ok()},
  respondConn(id,status,phone){db.connections[id].status=status;if(phone)db.connections[id].toPhone=phone;return ok()},
  deleteConn(id){delete db.connections[id];return ok()},
  signOut(){db.session=null;return ok()},
  isVerified(){return !!(db.members[USER.uid]||{}).emailVerified},
  resendVerify(){return Promise.resolve()},
  checkVerified(){const m=db.members[USER.uid];if(m){m.emailVerified=true;if(ME)ME.emailVerified=true}refresh();return Promise.resolve(true)},
  resetPw(e){return db.users[e.toLowerCase()]?Promise.resolve():fail("auth/user-not-found")},
  changePw(cur,nw){const e=USER.email;if(db.users[e].pw!==cur)return fail("auth/invalid-credential");db.users[e].pw=nw;return ok()},
  saveContent(patch){Object.assign(db.content,clone(patch));return ok()},
  saveDir(u,entry){if(entry===null)delete db.directory[u];else db.directory[u]=clone(entry);return ok()},
  saveMe(patch){Object.assign(db.members[USER.uid],clone(patch));return ok()},
  submit(type,data,anon){if(type!=="report"){db.quota=db.quota||{};const k=USER.uid+"_"+weekId(),q=db.quota[k]=db.quota[k]||{};if(!ADMIN&&(q.req||0)>=REQ_LIMIT)return fail("permission-denied");q.req=(q.req||0)+1}const d={type,data:clone(data),status:"pending",createdAt:{seconds:Date.now()/1000}};if(!anon){d.uid=USER.uid;d.name=myName()}db.requests[uid()]=d;return ok()},
  approveMember(p){db.members[p.uid].status="approved";db.directory[p.uid]=entryFrom(p.application);return ok()},
  setStatus(u,s){db.members[u].status=s;return ok()},
  resolve(id,s){db.requests[id].status=s;return ok()},
  rsvps(id){return Promise.resolve(clone(db.rsvps[id]||{}))},
  toggleRsvp(id,going,decline){db.rsvps[id]=db.rsvps[id]||{};if(going||decline)db.rsvps[id][USER.uid]=(decline?"no|":"")+myName();else delete db.rsvps[id][USER.uid];return ok()},
  photo(id){return Promise.resolve(db.photos[id]||"")},
  setPhoto(id,img){if(img)db.photos[id]=img;else delete db.photos[id];return ok()},
  privateOf(u){return Promise.resolve(clone(db.members[u]||{}))},
  allMembers(){return Promise.resolve(Object.keys(db.members).map(k=>Object.assign({uid:k},clone(db.members[k]))))},
  setAdmin(u,on){if(on)db.admins[u]={since:todayStr};else delete db.admins[u];return ok()},
  admins(){return Promise.resolve(Object.keys(db.admins))},
  opensToday(){return Promise.resolve(db.stats[todayStr]||0)},
  backup(){return Promise.resolve({app:"woman-next-door",version:1,date:new Date().toISOString(),collections:{content:{main:clone(db.content)},directory:{main:clone(db.directory)},members:clone(db.members),requests:clone(db.requests),rsvps:clone(db.rsvps),photos:clone(db.photos),admins:clone(db.admins)}})},
  restore(o){const c=o.collections||{};if(c.content&&c.content.main)db.content=c.content.main;if(c.directory&&c.directory.main)db.directory=c.directory.main;["members","requests","rsvps","photos","admins"].forEach(k=>{if(c[k])db[k]=c[k]});refresh();return Promise.resolve(Object.keys(c).length)},
  resetDemo(){localStorage.removeItem("wnd-demo");location.reload()}
 };
}

function parseDate(s){s=String(s||"").trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const t=Date.parse(s.replace(/(\d)(st|nd|rd|th)/i,"$1"));if(!isNaN(t))return ymd(new Date(t));const t2=Date.parse(s+" "+now.getFullYear());return isNaN(t2)?"":ymd(new Date(t2))}
function parseTime(s){s=String(s||"").trim().toLowerCase();const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/);if(!m)return "";let h=+m[1];const mi=m[2]||"00",ap=m[3]||"";if(ap.startsWith("p")&&h<12)h+=12;if(ap.startsWith("a")&&h===12)h=0;return h>23?"":pad(h)+":"+mi}
function parsePaste(txt){const lines=String(txt||"").replace(/\r/g,"").split("\n");let type="",cur=null;const f={};
 for(const raw of lines){const line=raw.trim();const hd=line.match(/^WND\s+(NEXT BOOK|ANNOUNCEMENT|FEATURED RESOURCE|FAITH RESOURCE|BIBLE STUDY|FAITH QUESTION|FAITH EVENT|DEVOTIONAL|TESTIMONY|PRAYER|VERSE|QUOTE|GUIDELINES|ABOUT|SLOGAN|DESCRIPTION|WIN|EVENT|TRIP|RESOURCE|BOOK|PRODUCT|RECOMMENDATION)\b/i);if(hd){type=hd[1].toUpperCase();cur=null;continue}
  const kv=raw.match(/^\s*([A-Za-z' ]{2,20}):\s*(.*)$/);if(kv){cur=kv[1].trim().toLowerCase();f[cur]=kv[2].trim();continue}
  if(cur!=null)f[cur]+=(f[cur]?"\n":"")+raw.trim()}
 Object.keys(f).forEach(k=>f[k]=f[k].trim());return {type,f}}
const findCat=(v,list)=>{v=String(v||"").toLowerCase();return list.find(c=>c.toLowerCase()===v)||list.find(c=>c.toLowerCase().includes(v)||v.includes(c.toLowerCase()))||""};
function applyPaste(txt){const {type,f}=parsePaste(txt),g=(...k)=>{for(const x of k)if(f[x])return f[x];return ""};
 if(!type){toast("Couldn't read that. Make sure it starts with WND EVENT, WND BOOK, etc.");return}
 if(type==="FAITH EVENT")f.type="faith";
 if(type==="EVENT"||type==="FAITH EVENT"){const cl=g("type","category").toLowerCase();const cat=Object.keys(CATS).find(k=>CATS[k].label.toLowerCase()===cl)||Object.keys(CATS).find(k=>cl&&CATS[k].label.toLowerCase().includes(cl))||"meetup";
  editEvent(null,{title:g("title","name"),date:parseDate(g("date")),time:parseTime(g("time")),place:g("location","place","where"),cat,desc:g("details","description"),album:g("album","photos")})}
 else if(type==="TRIP"){closeSheet();editTrip(null,{name:g("name","title"),dest:g("destination"),start:parseDate(g("start","start date")),end:parseDate(g("end","end date")),price:g("price","price from"),deposit:g("deposit"),spots:g("spots"),status:({"booking open":"open","open":"open","waitlist":"wait","sold out":"sold"})[g("status").toLowerCase()]||"open",includes:g("included","includes"),desc:g("details","description"),link:g("link")})}
 else if(type==="RESOURCE"){editRes(null,{title:g("title","name"),url:g("link","url"),cat:findCat(g("category"),RES_CATS)||"Other",desc:g("description","details"),by:g("shared by","by")})}
 else if(type==="RECOMMENDATION"){editRec(null,{title:g("title","name"),cat:findCat(g("category"),REC_CATS)||"Other",city:g("city"),desc:g("details","description"),url:g("link","url"),by:g("shared by","by")})}
 else if(type==="BOOK"){editBook("cur",{title:g("title"),author:g("author"),month:g("month"),readLink:g("read link","read"),buyLink:g("buy link","where to get it"),note:g("why","why we picked it","note"),schedule:g("plan","reading plan","schedule")})}
 else if(type==="NEXT BOOK"){editBook("next",{title:g("title"),author:g("author"),month:g("month"),buyLink:g("buy link","where to get it")})}
 else if(type==="FEATURED RESOURCE"){editRes(null,{title:g("title","name"),url:g("link","url"),cat:findCat(g("category"),RES_CATS)||"Other",desc:g("description","details"),by:g("shared by","by"),pinned:true})}
 else if(type==="WIN"){editWin(null,{name:g("name"),text:g("win","text","details"),date:parseDate(g("date"))||todayStr})}
 else if(type==="DEVOTIONAL"){editDev(null,{title:g("title"),ref:g("reference","scripture","ref"),verse:g("verse","verse text"),body:g("devotional","body","text"),prayer:g("prayer","closing prayer")})}
 else if(type==="FAITH RESOURCE"||type==="BIBLE STUDY"){editFRes(null,null,{kind:type==="BIBLE STUDY"?"study":"faith",title:g("title","name"),url:g("link","url"),desc:g("description","details")})}
 else if(type==="VERSE"){editVerse({ref:g("reference","ref"),text:g("verse","text")})}
 else if(type==="FAITH QUESTION"){editQ({q:g("question","text")})}
 else if(type==="TESTIMONY"){if(!C.faith)return;const t={id:uid(),name:g("name")||"A member",text:g("testimony","text"),date:todayStr};if(confirm("Post this testimony from "+t.name+"?"))saveC({faith:Object.assign({},C.faith,{testimonies:C.faith.testimonies.concat([t])})},"Testimony posted 🤍");return}
 else if(type==="PRAYER"){const p={id:uid(),name:g("name")||"A member",anon:/yes|true|anonymous/i.test(g("anonymous")),text:g("prayer","text"),date:todayStr};if(confirm("Post this prayer request?"))saveC({faith:Object.assign({},C.faith,{prayers:C.faith.prayers.concat([p])})},"Prayer request posted 🙏🏽");return}
 else if(type==="ANNOUNCEMENT"){sheet("Post an announcement",area("Announcement","nt-text",g("text","announcement","message")),'<span></span><button class="btn primary" data-act="save-note">Post announcement</button>')}
 else if(type==="QUOTE"){quoteSheet(g("quote","text"))}
 else if(type==="GUIDELINES"){editGuide(g("text","guidelines"))}
 else if(type==="ABOUT"){editAbout(g("text","about"))}
 else if(type==="SLOGAN"||type==="DESCRIPTION"){editSlogan({tagline:f.slogan!=null?g("slogan"):undefined,description:f.description!=null?g("description"):undefined})}
 else if(type==="PRODUCT"){editProd(null,{name:g("name","title"),cat:findCat(g("category"),SHOP_CATS)||SHOP_CATS[0],price:g("price"),desc:g("description","details"),link:g("link","buy link"),status:({"available":"available","coming soon":"soon","sold out":"sold"})[g("status").toLowerCase()]||"available"})}
 toast("Filled in. Check the details, then save.")}

function toast(msg){let t=$('.toast');if(t)t.remove();t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function burst(x,y){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const b=document.createElement("div");b.className="burst";b.style.left=x+"px";b.style.top=y+"px";
 for(let i=0;i<8;i++){const a=i/8*Math.PI*2;b.innerHTML+='<svg viewBox="0 0 24 24" style="--x:'+Math.round(Math.cos(a)*46)+'px;--y:'+Math.round(Math.sin(a)*46)+'px">'+SP+'</svg>'}
 document.body.appendChild(b);setTimeout(()=>b.remove(),900)}
function busy(el,on){if(!el)return;el.disabled=on;if(on){el.dataset.label=el.textContent;el.textContent="One moment…"}else if(el.dataset.label)el.textContent=el.dataset.label}
async function submitReq(el,type,data,anon,msg){busy(el,true);try{if(!ADMIN&&type!=="report"){const q=await S.quota();if((q.req||0)>=REQ_LIMIT){toast("You've shared "+REQ_LIMIT+" things this week, thank you! You can share more from "+weekResets()+" 💕");return}}
 await S.submit(type,data,anon);closeSheet();toast(msg)}catch(e){toast(e&&e.code==="permission-denied"?"You've reached this week's sharing limit. You can share more from "+weekResets()+" 💕":errMsg(e))}finally{busy(el,false)}}
async function connAllowed(){if(ADMIN)return true;const q=await S.quota();if((q.conn||0)>=CONN_LIMIT){sheet("See you next week 💕",'<p>You can say hi or connect with <b>'+CONN_LIMIT+' new people each week</b>. This keeps Woman Next Door friendly and spam-free.</p><p class="muted">You can reach out again from '+weekResets()+'. Replying to people who said hi to you doesn\'t count.</p>','<span></span><button class="btn primary" data-act="close">Got it</button>');return false}return true}

document.addEventListener("click",async ev=>{const el=ev.target.closest("[data-act]");if(!el)return;const act=el.getAttribute("data-act"),id=el.getAttribute("data-id");
 switch(act){
 /* navigation */
 case "tab":view=el.getAttribute("data-tab");sub=null;closeSheet();render();scrollTo(0,0);break;
 case "sub":{const s=el.getAttribute("data-sub");if(s==="trips"||s==="resources"){view=s;sub=null}else{view="more";sub=s}closeSheet();render();scrollTo(0,0);break}
 case "close":closeSheet();break;
 case "close-splash":{const s=$('#splash');if(s)s.remove();break}
 case "splash":splash(true);break;
 case "asmember":asMember=!asMember;render();toast(asMember?"Member view":"Admin view");break;
 case "mprev":calM--;if(calM<0){calM=11;calY--}render();break;
 case "mnext":calM++;if(calM>11){calM=0;calY++}render();break;
 case "selday":selDay=el.getAttribute("data-d")||null;render();break;
 case "memmode":memMode=el.getAttribute("data-m");render();break;
 case "findq":q=el.getAttribute("data-q");memMode="all";view="members";sub=null;render();scrollTo(0,0);break;
 case "clearq":q="";render();break;

 case "reccat":recCat=el.getAttribute("data-c");render();break;
 case "pick":{const g=el.parentElement,max=+(g.getAttribute("data-max")||5);if(max===1){$$('.chip',g).forEach(b=>{if(b!==el)b.classList.remove("on")});el.classList.toggle("on");break}
  if(!el.classList.contains("on")&&$$('.chip.on',g).length>=max){toast("Pick up to "+max);break}el.classList.toggle("on");break}
 case "myint":{const i=el.getAttribute("data-i"),k=myInts.indexOf(i);if(k>-1)myInts.splice(k,1);else myInts.push(i);try{localStorage.setItem("wnd-my-interests",JSON.stringify(myInts))}catch(e){}render();break}

 /* account */

 case "do-login":{const e=val("l-email"),p=$('#l-pw').value;if(!e||!p){toast("Enter your email and password");break}busy(el,true);try{await S.signIn(e,p);closeSheet();view="home";sub=null}catch(err){toast(errMsg(err))}finally{busy(el,false)}break}
 case "send-reset":{const e=val("f-email");if(!e){toast("Enter your email");break}busy(el,true);try{await S.resetPw(e);closeSheet();toast("Check your email for a link to reset your password 💌")}catch(err){toast(errMsg(err))}finally{busy(el,false)}break}
 case "join-next":{const n=val("j-name"),e=val("j-email"),p=$('#j-pw').value;if(!n||!e){toast("Add your name and email");break}
  const perr=pwCheck(p,$('#j-pw2').value);if(perr){toast(perr);break}if(digits(val("j-phone")).length<7){toast("Add your WhatsApp number");break}if(!val("j-city")||!val("j-country")){toast("Add your city and country");break}
  $('#js1').hidden=true;$('#js2').hidden=false;$('#sheetbg .sheet').scrollTop=0;break}

  const a={name:n,phone:val("j-phone"),city:val("j-city"),country:val("j-country"),work:val("j-work"),interests:picked("pick"),hopes:picked("hopes"),heard:picked("heard")[0]||"",noMedia:chk("j-nomedia"),optIn:chk("j-optin"),platform:val("j-plat"),social:handle(val("j-soc")),bio:"",bizName:val("j-bizn"),bizLink:val("j-bizl"),bizPlatform:val("j-bizp"),joined:todayStr};busy(el,true);

 case "logout":asMember=false;view="home";sub=null;ADMIN_LIST=null;OPENS=null;NOTIFY=null;PRAYED={};ALLM=null;await run(S.signOut()).catch(()=>{});break;
 case "reset-demo":if(confirm("Reset all demo data?"))S.resetDemo();break;
 case "save-profile":{const e=profileVals("p",D[USER.uid]);if(!e.name){toast("Add your name");break}const prev=((D[USER.uid]||{}).interests)||[],fresh=customOf(e.interests).filter(i=>!prev.includes(i));busy(el,true);try{await S.saveDir(USER.uid,e);await S.saveMe({name:e.name}).catch(()=>{});for(const i of fresh){if(!admin())await S.submit("interest",{name:i},false).catch(()=>{});else await S.saveContent({customInterests:(C.customInterests||[]).concat([i])}).catch(()=>{})}toast("Profile saved 💕")}catch(err){toast(errMsg(err))}finally{busy(el,false)}break}

 /* events & rsvp */
 case "open-ev":openEvent(id);break;

   else await saveC(upsertArr("events",rec,id),id?"Event updated":"Event added")}catch(err){toast(errMsg(err));busy(el,false)}break}
 case "resched-ev":{const e=byId(C.events,id);if(!e)break;sheet("Reschedule "+e.title,'<p class="muted" style="margin-top:0">Currently '+esc(whenOf(e))+'. RSVPs stay the same, and everyone sees the update.</p><div class="two">'+fld("New date","rs-date",e.date,"date")+fld("New time","rs-time",e.time,"time")+'</div>'+fld("Location","rs-place",e.place)+fld("Short note (optional)","rs-note","","text","Rain forecast, so we moved to Sunday"),'<span></span><button class="btn primary" data-act="save-resched" data-id="'+id+'">Reschedule & announce</button>');break}

 case "backup":{busy(el,true);try{const data=await S.backup();const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="woman-next-door-backup-"+todayStr+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Backup downloaded")}catch(err){toast(errMsg(err))}finally{busy(el,false)}break}
 case "restore":{const f=$('#restore-file').files[0];if(!f){toast("Choose a backup file first");break}let data;try{data=JSON.parse(await f.text())}catch(e){toast("That file isn't a Woman Next Door backup");break}
  if(data.app!=="woman-next-door"){toast("That file isn't a Woman Next Door backup");break}if(!confirm("Restore everything from the backup dated "+(data.date||"").slice(0,10)+"? Current data will be replaced by what's in the file."))break;
  busy(el,true);try{await S.restore(data);toast("Restored from backup")}catch(err){toast(errMsg(err))}finally{busy(el,false)}break}
 }});

document.addEventListener("change",ev=>{if(ev.target.id!=="f-photo")return;const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  let q=.72,out=c.toDataURL("image/jpeg",q);while(out.length>700000&&q>.3){q-=.1;out=c.toDataURL("image/jpeg",q)}pendingPhoto=out;const pv=$('#f-prev');if(pv){pv.src=out;pv.hidden=false}};img.src=r.result};r.readAsDataURL(f)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();const s=$('#splash');if(s)s.remove()}});

 S.start()})();
